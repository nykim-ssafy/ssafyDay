<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빨간 네모 맞추기 게임</title>
    <style>
        body { margin: 0; background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #container { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; background-color: #000; cursor: crosshair; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #zoomed-canvas { display: none; z-index: 10; transform: scaleX(1); }
        /* 미리보기 및 미션 박스 */
        #preview-box, #target-box { position: absolute; border: 4px dashed #ff4757; background-color: rgba(255, 71, 87, 0.1); pointer-events: none; z-index: 5; display: none; }
        #preview-box { border-color: rgba(255, 71, 87, 0.5); border-style: solid; }
        .overlay-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 15; }
        #countdown { font-size: 80px; font-weight: bold; color: #ff4757; }
        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .game-btn { padding: 12px 30px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 30px; cursor: pointer; }
        #start-btn { background-color: #ff4757; }
        #reset-btn { background-color: #57606f; display: none; }
    </style>
</head>
<body>

    <h2>🎯 빨간 네모 맞추기</h2>
    <div id="container" onmousemove="updatePreview(event)">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="zoomed-canvas"></canvas>
        <div id="preview-box"></div>
        <div id="target-box"></div>
        <div class="overlay-ui"><div id="countdown"></div></div>
    </div>

    <div class="controls">
        <div class="size-selector">
            사이즈 선택: 
            <input type="radio" name="size" value="150" onchange="changeSize(150)"> 작게 
            <input type="radio" name="size" value="220" checked onchange="changeSize(220)"> 보통 
            <input type="radio" name="size" value="300" onchange="changeSize(300)"> 크게 
        </div>
        <button id="start-btn" class="game-btn" onclick="startGame()">게임 시작</button>
        <button id="reset-btn" class="game-btn" onclick="resetGame()">다시 하기</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const previewBox = document.getElementById('preview-box');
        const targetBox = document.getElementById('target-box');
        let currentSize = 220;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
            } catch (e) { alert("카메라 권한이 필요합니다."); }
        }

        // 마우스 따라다니는 미리보기
        function updatePreview(e) {
            const rect = document.getElementById('container').getBoundingClientRect();
            const x = e.clientX - rect.left - currentSize/2;
            const y = e.clientY - rect.top - currentSize/2;
            previewBox.style.width = currentSize + 'px';
            previewBox.style.height = currentSize + 'px';
            previewBox.style.left = Math.max(0, Math.min(x, 640 - currentSize)) + 'px';
            previewBox.style.top = Math.max(0, Math.min(y, 480 - currentSize)) + 'px';
            if(document.getElementById('start-btn').disabled === false) previewBox.style.display = 'block';
        }

        function changeSize(size) { currentSize = size; }

        async function startGame() {
            previewBox.style.display = 'none';
            document.getElementById('start-btn').disabled = true;
            
            const x = Math.floor(Math.random() * (640 - currentSize));
            const y = Math.floor(Math.random() * (480 - currentSize));

            targetBox.style.width = currentSize + 'px';
            targetBox.style.height = currentSize + 'px';
            targetBox.style.left = x + 'px';
            targetBox.style.top = y + 'px';
            targetBox.style.display = 'block';

            for (let i = 3; i > 0; i--) {
                document.getElementById('countdown').textContent = i;
                await new Promise(r => setTimeout(r, 1000));
            }
            document.getElementById('countdown').textContent = "찰칵!";
            await new Promise(r => setTimeout(r, 500));
            document.getElementById('countdown').textContent = "";

            const canvas = document.getElementById('zoomed-canvas');
            canvas.width = currentSize; canvas.height = currentSize;
            const ctx = canvas.getContext('2d');
            videoElement.style.display = 'none';
            targetBox.style.display = 'none';
            
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -(x + currentSize), y, currentSize, currentSize, 0, 0, currentSize, currentSize);
            canvas.style.display = 'block';
            document.getElementById('reset-btn').style.display = 'inline-block';
        }

        function resetGame() {
            document.getElementById('zoomed-canvas').style.display = 'none';
            videoElement.style.display = 'block';
            document.getElementById('reset-btn').style.display = 'none';
            document.getElementById('start-btn').disabled = false;
        }

        initCamera();
    </script>
</body>
</html>
